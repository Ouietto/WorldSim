name: Ensemble check

# Runs Earth histories for the model check in parallel, one seed per runner, and stores each result
# on the ensemble-results branch under cache/, named exactly as tools/ensemble.js names its cache files.
# Start it by pushing a change to tools/ensemble-request.json on a working branch, or by hand from the Actions tab.
# Fetch results locally with: git fetch origin ensemble-results && git --work-tree=reports checkout origin/ensemble-results -- cache && git reset -q cache
on:
  push:
    branches: ['claude/**']
    paths: ['tools/ensemble-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensemble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.p.outputs.seeds }}
      end: ${{ steps.p.outputs.end }}
      env: ${{ steps.p.outputs.env }}
      ref: ${{ steps.p.outputs.ref }}
      baseEnv: ${{ steps.p.outputs.baseEnv }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          node -e '
            const r=require("./tools/ensemble-request.json");
            const range=s=>String(s).split(",").flatMap(p=>{const m=p.match(/^(\d+)-(\d+)$/);if(!m)return[p];const a=[];for(let i=+m[1];i<=+m[2];i++)a.push(String(i));return a});
            const o={seeds:JSON.stringify(range(r.seeds||"1-16")),end:String(r.end??1500),env:r.env||"",ref:r.ref||"",baseEnv:r.baseEnv||""};
            for(const [k,v] of Object.entries(o))require("fs").appendFileSync(process.env.GITHUB_OUTPUT,k+"="+v+"\n");'

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run seed ${{ matrix.seed }}
        run: |
          args=(--seeds "${{ matrix.seed }}" --end "${{ needs.plan.outputs.end }}" --jobs 2)
          [ -n "${{ needs.plan.outputs.env }}" ] && args+=(--env "${{ needs.plan.outputs.env }}")
          [ -n "${{ needs.plan.outputs.ref }}" ] && args+=(--ref "${{ needs.plan.outputs.ref }}")
          [ -n "${{ needs.plan.outputs.baseEnv }}" ] && args+=(--base-env "${{ needs.plan.outputs.baseEnv }}")
          node tools/ensemble.js "${args[@]}" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.seed }}
          path: reports/cache/*.json

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ensemble-results-push
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true
      - name: Store results on the ensemble-results branch
        run: |
          git init -q store && cd store
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "ensemble-bot" && git config user.email "ensemble-bot@users.noreply.github.com"
          if git fetch -q --depth 1 origin ensemble-results; then git checkout -q -b ensemble-results FETCH_HEAD; else git checkout -q --orphan ensemble-results; fi
          mkdir -p cache && cp ../incoming/*.json cache/ 2>/dev/null || true
          git add cache && git commit -qm "Ensemble results for ${{ github.sha }}" || echo "nothing new"
          git push -q origin ensemble-results
